  const buckets = new Map();

  mNg.textContent = m.ng.toFixed(1) + " %";
  mNp.textContent = m.np.toFixed(1) + " %";
  mNr.textContent = m.nr.toFixed(1) + " %";
  mTot.textContent = Math.round(m.tot) + " °C";
  mTq.textContent = Math.round(m.tq) + " %";

  const txt =
    "COLL " + Math.round(m.coll) + "% · NG " + m.ng.toFixed(1) + "% · NP " + m.np.toFixed(1) + "% · NR " + m.nr.toFixed(1) + "% · TOT " + Math.round(m.tot) + " °C · TQ " + Math.round(m.tq) + "%";
  if (readout.textContent !== txt) readout.textContent = txt;
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring && !calm) {
    clock += dt;
    targetColl = tourTarget(clock);
    slider.value = String(Math.round(targetColl));
  }
  prevColl = coll;
  coll = calm ? targetColl : coll + (targetColl - coll) * (1 - Math.exp(-dt / 0.22));
  if (Math.abs(targetColl - coll) < 0.04) coll = targetColl;

  const dColl = dt > 1e-4 ? (coll - prevColl) / dt : 0;
  if (calm) {
    npErr = 0;
    npVel = 0;
  } else {
    npVel += (-36 * npErr - 10.5 * npVel - 0.032 * dColl) * dt;
    npErr = clamp(npErr + npVel * dt, -1.6, 1.6);
    if (Math.abs(npErr) < 0.005 && Math.abs(npVel) < 0.005 && Math.abs(dColl) < 0.05) { npErr = 0; npVel = 0; }
  }

  const m = modelAt(coll, npErr);
  if (!calm) {
    const wNp = Math.PI * 2 * 0.42 * (m.np / 100);
    const wNg = Math.PI * 2 * (0.28 + 1.05 * clamp((m.ng - 65) / 32, 0, 1));
    angNp = (angNp + wNp * dt) % (Math.PI * 2);
    angNg = (angNg + wNg * dt) % (Math.PI * 2);
  }
  render(m);

  const settled = calm && coll === targetColl && npErr === 0;
  frame = visible && !document.hidden && !settled ? requestAnimationFrame(tick) : 0;
}

const run = () => { if (!frame && visible && !document.hidden) { last = 0; frame = requestAnimationFrame(tick); } };

function setUserColl(val, resumeLater = true) {
  touring = false;
  btnTour.textContent = "Ciclo automatico: OFF";
  targetColl = clamp(val, 0, 100);
  slider.value = String(Math.round(targetColl));
  stage.setAttribute("aria-valuenow", String(Math.round(targetColl)));
  stage.setAttribute("aria-valuetext", "Collettivo " + Math.round(targetColl) + " percento");
  clearTimeout(idleTimer);
  if (resumeLater && !still.matches) {
    idleTimer = setTimeout(() => { touring = true; btnTour.textContent = "Ciclo automatico: ON"; run(); }, 7000);
  }
  run();
}

slider.addEventListener("input", (e) => setUserColl(Number(e.target.value), true));
btnTour.addEventListener("click", () => {
  if (still.matches) return;
  touring = !touring;
  clearTimeout(idleTimer);
  btnTour.textContent = touring ? "Ciclo automatico: ON" : "Ciclo automatico: OFF";
  if (touring) run();
});

let dragging = false;
stage.addEventListener("pointerdown", (e) => {
  dragging = true;
  stage.setPointerCapture(e.pointerId);
  const box = svg.getBoundingClientRect();
  setUserColl(((e.clientX - box.left) / box.width - 0.12) / 0.76 * 100, true);
});
stage.addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const box = svg.getBoundingClientRect();
  setUserColl(((e.clientX - box.left) / box.width - 0.12) / 0.76 * 100, true);
});
stage.addEventListener("pointerup", () => { dragging = false; });
stage.addEventListener("pointercancel", () => { dragging = false; });

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (window.parent && window.parent !== window) window.parent.postMessage("uh169-fig-close", "*");
    return;
  }
  if (document.activeElement === slider) return;
  const step = e.shiftKey ? 15 : 5;
  if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); setUserColl(targetColl + step); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); setUserColl(targetColl - step); }
  else if (e.key === "Home") { e.preventDefault(); setUserColl(0); }
  else if (e.key === "End") { e.preventDefault(); setUserColl(100); }
  else if (e.key === " ") { e.preventDefault(); btnTour.click(); }
});

document.addEventListener("visibilitychange", () => { if (!document.hidden && visible) run(); });
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
if (still.matches) btnTour.textContent = "Moto ridotto";
render(modelAt(coll, 0));
run();
</script></body></html>
