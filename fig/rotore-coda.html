  <span class="iso-caption">Il rotore principale dell’AW169 gira in senso antiorario visto dall’alto, quindi la sua coppia di reazione tende a far imbardare il muso a destra (rapporto AAIB, Air Accidents Investigation Branch, 1/2023). Per compensarla, il rotore di coda a 3 pale completamente articolate (diametro 2,40 m, certificato EASA, European Union Aviation Safety Agency, R.509; 1586 giri/min a NR, giri del rotore, al 100%) genera una spinta laterale a braccio lungo la trave di coda. La pedaliera trasmette il comando lungo la fusoliera con un cavo flessibile su sfere in guaina fino alla TGB (Tail Gear Box, riduttore di coda) e al TRA (Tail Rotor Actuator, attuatore del rotore di coda, doppio impianto idraulico, forza di stallo 25 780 N con due impianti e 12 760 N con uno); l’albero di comando non rotante sposta il cuscinetto duplex nel ragno a 3 bracci, variando il passo collettivo delle 3 pale tra i fermi primari −10° e +25°. Alzando il collettivo cresce la coppia del rotore principale e serve più pedale sinistro per mantenere l’equilibrio. Coppie in N·m, spinta in N e braccio (~7,5 m) sono valori indicativi.</span>
</figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {
    const a = azimuth * RADIANS;
    const e = elevation * RADIANS;
    return { sinA: Math.sin(a), cosA: Math.cos(a), sinE: Math.sin(e), cosE: Math.cos(e), k: scale * UNIT };
}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}
function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)
        return "";
    return points.map(([x, y], at) => `${at ? "L" : "M"}${tenth(x)} ${tenth(y)}`).join("") + (closed ? "Z" : "");
}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],
        [x + radius, y + d - radius, 90],
        [x + radius, y + radius, 180],
    ];
    const out = [];
    for (const [cx, cy, start] of corners) {
        const count = radius > 0 ? steps : 0;
        for (let step = 0; step <= count; step++) {
            const angle = (start + (count ? (90 * step) / count : 45)) * RADIANS;

    list.push({
      d: depthOf([D.X_MR, 20, 1], P) + 1,
      svg: '<path d="M' + f1(p0[0]) + " " + f1(p0[1]) + "L" + f1(p1[0]) + " " + f1(p1[1]) + '" stroke="' + col + '" stroke-width="2.2" stroke-linecap="round"/>',
    });
  }

  // 2. Rotore di coda a 3 pale (destra, asse trasversale y!) + albero di comando, cuscinetto duplex, ragno a 3 bracci (lit!) e 3 aste di passo!
  const yHub = 16; // lato +y della TGB verso l'osservatore
  const ySlide = yHub + 15 + 0.45 * m.pitchDeg; // corsa assiale del ragno e dell'albero di comando (-10° -> y=26.5, +25° -> y=42.2!)
  const pRad = m.pitchDeg * DEG;

  // Albero cavo mozzo coda dalla TGB (y = 2..yHub) + albero di comando non rotante fino al ragno (y = yHub..ySlide)
  list.push({ d: depthOf([D.X_TR, 9, D.Z_BOOM], P), svg: drawRod3D([D.X_TR, 2, D.Z_BOOM], [D.X_TR, yHub, D.Z_BOOM], 5.5, { tone: "hi", ends: false }) });
  list.push({ d: depthOf([D.X_TR, (yHub + ySlide) / 2, D.Z_BOOM], P), svg: drawRod3D([D.X_TR, yHub, D.Z_BOOM], [D.X_TR, ySlide, D.Z_BOOM], 2.4, { tone: "hi", lit: true, ends: false }) });

  // Mozzo del rotore di coda (3 bracci) + 3 pale articolate (ruotano con angTr e cambiano passo di pRad!)
  const trHubPt = [D.X_TR, yHub, D.Z_BOOM];
  const trPt = (ang, r, c, t) => {
    // Piano di rotazione (x, z), asse trasversale y. Passo ruota (c, t) nel piano tangente-y!
    const cp = Math.cos(pRad), sp = Math.sin(pRad);
    const c1 = c * cp - t * sp;
    const y1 = c * sp + t * cp;
    const rx = Math.cos(ang), rz = Math.sin(ang);
    const tx = -Math.sin(ang), tz = Math.cos(ang);
    return [D.X_TR + r * rx + c1 * tx, yHub + y1, D.Z_BOOM + r * rz + c1 * tz];
  };

  for (let k = 0; k < 3; k++) {
    const a = angTr + (k * Math.PI * 2) / 3;
    const top = [trPt(a, 8, -4.8, 1.3), trPt(a, 50, -4.6, 1.1), trPt(a, 50, 5.2, 0.5), trPt(a, 8, 5.4, 0.7)];
    const bot = [trPt(a, 8, -4.8, -1.3), trPt(a, 50, -4.6, -1.1), trPt(a, 50, 5.2, -0.5), trPt(a, 8, 5.4, -0.7)];
    // Bande alta visibilità punta pala (bianco/rosso come su AW169)
    const tipA = iso(trPt(a, 44, -4.6, 1.1), P), tipB = iso(trPt(a, 44, 5.2, 0.5), P);
    const band = '<path d="M' + f1(tipA[0]) + " " + f1(tipA[1]) + "L" + f1(tipB[0]) + " " + f1(tipB[1]) + '" stroke="var(--anatomy-red)" stroke-width="2.0"/>';
    list.push({ d: depthOf(trPt(a, 28, 0, 0), P), svg: drawBox3D(top, bot, { tone: "hi" }) + band });

    // Braccio del ragno (lit!) + biella di comando del passo verso il bordo d'uscita della pala
    const armTip = [D.X_TR + 12 * Math.cos(a + 0.55), ySlide, D.Z_BOOM + 12 * Math.sin(a + 0.55)];
    const bladeHorn = trPt(a, 12, 6.2, 0);
    list.push({ d: depthOf(armTip, P) + 0.8, svg: drawRod3D([D.X_TR, ySlide, D.Z_BOOM], armTip, 1.6, { tone: "hi", lit: true, ends: true }) });
    list.push({ d: depthOf([(armTip[0] + bladeHorn[0]) / 2, (armTip[1] + bladeHorn[1]) / 2, (armTip[2] + bladeHorn[2]) / 2], P) + 0.6, svg: drawRod3D(armTip, bladeHorn, 1.3, { tone: "hi", lit: true, ends: true }) });
  }
  // Cuscinetto duplex al centro del ragno (anello evidenziato!)
  {
    const pSp = iso([D.X_TR, ySlide, D.Z_BOOM], P);
    list.push({
      d: depthOf([D.X_TR, ySlide, D.Z_BOOM], P) + 2,
      svg:
        '<circle cx="' + f1(pSp[0]) + '" cy="' + f1(pSp[1]) + '" r="6.2" fill="var(--anatomy-lit-top)" stroke="var(--anatomy-lit)" stroke-width="1.2"/>' +
        '<circle cx="' + f1(pSp[0]) + '" cy="' + f1(pSp[1]) + '" r="2.8" fill="var(--anatomy-card)" stroke="var(--anatomy-blue)" stroke-width="1.0"/>',
    });
  }

  // Vettore SPINTA LATERALE del rotore di coda (lit!): a passo positivo tira la coda verso -y (DESTRA) generando coppia antioraria che compensa la reazione oraria!
  {
    const tLen = clamp((m.thrust / 3600) * 58, -42, 62);
    if (Math.abs(tLen) > 2) {
      const base = [D.X_TR, -26, D.Z_BOOM + 22];
      const tip = [D.X_TR, -26 - tLen, D.Z_BOOM + 22];
      const p0 = iso(base, P), p1 = iso(tip, P);
      const dx = p1[0] - p0[0], dy = p1[1] - p0[1], l = Math.hypot(dx, dy) || 1;
      const ux = dx / l, uy = dy / l, px = -uy, py = ux;
      const ah = "M" + f1(p1[0]) + " " + f1(p1[1]) + "L" + f1(p1[0] - ux * 9 + px * 4.2) + " " + f1(p1[1] - uy * 9 + py * 4.2) + "L" + f1(p1[0] - ux * 9 - px * 4.2) + " " + f1(p1[1] - uy * 9 - py * 4.2) + "Z";
      const col = m.thrust >= 0 ? "var(--anatomy-lit)" : "var(--anatomy-red)";
      list.push({
        d: 1e6,
        svg:
          '<path d="M' + f1(p0[0]) + " " + f1(p0[1]) + "L" + f1(p1[0]) + " " + f1(p1[1]) + '" stroke="' + col + '" stroke-width="2.4" stroke-linecap="round"/>' +
          '<path d="' + ah + '" fill="' + col + '"/>',
      });
    }
  }

  // 3. Pedaliera mobile sul banco anteriore sinistro: guardando verso PRUA (-x), pedale SX è lato +y (b.y+19) e avanza verso -x col passo positivo!
  {
    const norm = (m.pitchDeg - 7.5) / 17.5;
    const dxPed = norm * 9;
    const b = D.PED_BOX;
    const pedR = slabOf({ x: b.x + 24 + dxPed, y: b.y + 5, w: 6, d: 10, r: 1.2 }, 8, 15, P, 3, 0.5);
    const pedL = slabOf({ x: b.x + 24 - dxPed, y: b.y + 19, w: 6, d: 10, r: 1.2 }, 8, 15, P, 3, 0.5);
    list.push({ d: depthOf([b.x + 27 + dxPed, b.y + 10, 15], P) + 5, svg: solidSvg(pedR, { tone: "hi", lit: m.pitchDeg < 2 }) });
    list.push({ d: depthOf([b.x + 27 - dxPed, b.y + 24, 15], P) + 5, svg: solidSvg(pedL, { tone: "hi", lit: m.pitchDeg > 8 }) });
  }

  list.sort((a, b) => a.d - b.d);
  liveG.innerHTML = list.map((o) => o.svg).join("");

  // Aggiorna letture
  vColl.textContent = Math.round(m.coll) + " %";
  vPitch.textContent = (m.pitchDeg >= 0 ? "+" : "") + m.pitchDeg.toFixed(1) + "°";
  mQrot.textContent = Math.round(m.qRot).toLocaleString("it-IT") + " N·m";
  mThrust.textContent = (m.thrust >= 0 ? "+" : "") + Math.round(m.thrust).toLocaleString("it-IT") + " N";
  mQcomp.textContent = (m.qComp >= 0 ? "+" : "") + Math.round(m.qComp).toLocaleString("it-IT") + " N·m";
  mPitch.textContent = (m.pitchDeg >= 0 ? "+" : "") + m.pitchDeg.toFixed(1) + "°";
  mState.textContent = m.state;
  mStateBox.classList.toggle("ok", m.balanced);
  mStateBox.classList.toggle("warn", !m.balanced);

  const txt =
    "Q ROT " + Math.round(m.qRot) + " N·m · PASSO CODA " + (m.pitchDeg >= 0 ? "+" : "") + m.pitchDeg.toFixed(1) + "° · SPINTA " + Math.round(m.thrust) + " N · Q COMP " + Math.round(m.qComp) + " N·m · " + m.state;
  if (readout.textContent !== txt) readout.textContent = txt;
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  const k = calm ? 1 : 1 - Math.exp(-dt / 0.18);
  coll += (tColl - coll) * k; if (Math.abs(tColl - coll) < 0.05) coll = tColl;
  pitch += (tPitch - pitch) * k; if (Math.abs(tPitch - pitch) < 0.02) pitch = tPitch;
  if (!paused && !calm) {
    angMr = (angMr + dt * Math.PI * 2 * 0.18) % (Math.PI * 2); // antiorario
    angTr = (angTr + dt * Math.PI * 2 * 0.85) % (Math.PI * 2); // ~4.8x più veloce (1586 vs ~330 giri/min!)
  }
  render(modelAt(coll, pitch));
  const settled = (paused || calm) && coll === tColl && pitch === tPitch;
  frame = visible && !document.hidden && !settled ? requestAnimationFrame(tick) : 0;
}

const run = () => { if (!frame && visible && !document.hidden) { last = 0; frame = requestAnimationFrame(tick); } };

slColl.addEventListener("input", (e) => { tColl = Number(e.target.value); run(); });
slPitch.addEventListener("input", (e) => { tPitch = Number(e.target.value); run(); });
btnTrim.addEventListener("click", () => {
  tPitch = Math.round(eqPitchFor(tColl) * 2) / 2;
  slPitch.value = String(tPitch);
  run();
});
btnPause.addEventListener("click", () => {
  if (still.matches) return;
  paused = !paused;
  btnPause.textContent = paused ? "Riprendi moto" : "Pausa moto";
  run();
});

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (window.parent && window.parent !== window) window.parent.postMessage("uh169-fig-close", "*");
    return;
  }
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  if (e.key === "ArrowUp") { e.preventDefault(); tColl = clamp(tColl + 10, 0, 100); slColl.value = String(tColl); run(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); tColl = clamp(tColl - 10, 0, 100); slColl.value = String(tColl); run(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); tPitch = clamp(tPitch + 2, -10, 25); slPitch.value = String(tPitch); run(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); tPitch = clamp(tPitch - 2, -10, 25); slPitch.value = String(tPitch); run(); }
  else if (e.key === "e" || e.key === "E") { e.preventDefault(); btnTrim.click(); }
  else if (e.key === " ") { e.preventDefault(); btnPause.click(); }
});

document.addEventListener("visibilitychange", () => { if (!document.hidden && visible) run(); });
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
if (still.matches) btnPause.textContent = "Moto ridotto";
render(modelAt(coll, pitch));
run();
</script></body></html>
