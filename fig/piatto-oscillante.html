`;

const D = {"P":{"origin":[430,275.0914401131562],"scale":1.0120378752000305,"azimuth":44,"elevation":32},"V":[0.6100347481667368,0.5891037085468779,0.5299192642332049],"Z_DECK":24,"Z_MAST_BASE":38,"Z_HUB":148,"R_SRV":52,"SRV_ANGLES":[30,150,270],"Z_SRV_TOP":64};
const P = D.P, V = D.V;
const DEG = Math.PI / 180;
const NB = 5;
const LUG = 22 * DEG; // anticipo della squadretta sul bordo d'attacco (rotazione antioraria vista dall'alto)
const R_SW_F = 50, R_SW_R = 45, R_SW_IN = 16;
const R_HORN = 45, R_HUB = 22, R_GRIP0 = 26, R_GRIP1 = 56, R_BLADE = 124;

const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const liveG = svg.querySelector('[data-part="rotor-live"]');
const slColl = document.querySelector("#slColl");
const slLon = document.querySelector("#slLon");
const slLat = document.querySelector("#slLat");
const vColl = document.querySelector("#vColl");
const vLon = document.querySelector("#vLon");
const vLat = document.querySelector("#vLat");
const btnSpin = document.querySelector("#btnSpin");
const btnZero = document.querySelector("#btnZero");
const btnTour = document.querySelector("#btnTour");
const readout = document.querySelector("[data-readout]");
const bCells = [0, 1, 2, 3, 4].map((i) => ({ box: document.querySelector("#bBox" + i), az: document.querySelector("#bAz" + i), val: document.querySelector("#bVal" + i) }));
const thrVal = document.querySelector("#thrVal");
const thrDir = document.querySelector("#thrDir");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const f1 = (n) => (Math.round(n * 10) / 10).toFixed(1);

// Coordinate mondo (sistema iso-kit): +x = PRUA (avanti, in basso a dx), -y = SINISTRA (in alto a dx), -x = POPPA (in alto a sx), +y = DESTRA (in basso a sx), +z = alto
// Con azimut antiorario psi (0°=PRUA, 90°=SINISTRA, 180°=POPPA, 270°=DESTRA): punto radiale = (r*cos(psi), -r*sin(psi)) -> rotazione veramente ANTIORARIA vista dall'alto!
function rotorModel(coll, lon, lat, ang) {
  const th0 = 2 + 0.12 * coll; // ° passo collettivo (2..14° indicativo)
  const B = 6.0; // ° ampiezza ciclico (±6° indicativo)
  const zSw = 86 + 0.24 * coll; // quota centro piatto oscillante (86..110)
  // Piano piatto: z(x,y) = zSw + gx*x + gy*y, valutato all'attacco asta (x = R cos(psi+LUG), y = -R sin(psi+LUG))
  const K_SW = 13.5 / R_SW_R;
  const gx = K_SW * (lat * Math.cos(LUG) - lon * Math.sin(LUG));
  const gy = -K_SW * (lon * Math.cos(LUG) + lat * Math.sin(LUG));
  const blades = [];
  for (let k = 0; k < NB; k++) {
    const phi = ((ang + (k * 2 * Math.PI) / NB) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI);
    const pitch = th0 + B * (lon * Math.sin(phi) + lat * Math.cos(phi));
    const flap = 1.5 + 0.025 * coll - 3.5 * (lon * Math.cos(phi) - lat * Math.sin(phi)); // ritardo 90° antiorario
    blades.push({ k, phi, deg: Math.round(phi / DEG) % 360, pitch, flap });
  }
  const tilt = B * Math.hypot(lon, lat);
  // Direzione vettore di spinta: (+lon lungo +x PRUA, +lat lungo +y DESTRA)
  let dirLabel = "verticale";
  if (tilt >= 0.25) {
    const a = ((Math.atan2(-lat, lon) / DEG) + 360) % 360; // 0° PRUA, 90° SX, 180° POPPA, 270° DX
    const dirs = ["AVANTI", "AVANTI-SX", "SINISTRA", "INDIETRO-SX", "INDIETRO", "INDIETRO-DX", "DESTRA", "AVANTI-DX"];
    dirLabel = dirs[Math.round(a / 45) % 8];
  }
  return { coll, lon, lat, ang, th0, zSw, gx, gy, blades, tilt, dirLabel };
}

// Helper vettoriali e shading a 4 toni coerente con iso-kit
const cam = cameraOf(P);
const LDIR = [
  (-0.55 * cam.sinA + 0.35 * cam.cosA),
  (0.55 * cam.cosA + 0.35 * cam.sinA),
  0.76,
];
const Llen = Math.hypot(LDIR[0], LDIR[1], LDIR[2]);
const L = LDIR.map((v) => v / Llen);

function dot3(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
function sub3(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function cross3(a, b) { return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]]; }
function norm3(a) { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; }

function shadeFor(n) {
  const s = dot3(n, L);
  if (s > 0.72) return "top";
  if (s > 0.42) return "3";
  if (s > 0.14) return "2";
  if (s > -0.18) return "1";
  return "0";
}

function polyPath(pts3) {
  const p = pts3.map((q) => iso(q, P));
  return "M" + p.map((q) => f1(q[0]) + " " + f1(q[1])).join("L") + "Z";
}

// Disegna un prisma/box orientato 3D con facce visibili ombreggiate a 4 toni (per manicotti, pale ritorte, piatto inclinato!)
function drawBox3D(ptsTop, ptsBot, { tone = "hi", lit = false, edge = true } = {}) {
  const n = ptsTop.length;
  const faces = [];
  // Top face
  const nt = norm3(cross3(sub3(ptsTop[1], ptsTop[0]), sub3(ptsTop[2], ptsTop[0])));
  if (dot3(nt, V) > 0) faces.push({ pts: ptsTop, n: nt, top: true });
  // Bottom face
  const nb = nt.map((v) => -v);
  if (dot3(nb, V) > 0) faces.push({ pts: [...ptsBot].reverse(), n: nb, top: false });
  // Side quads
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    const q = [ptsBot[i], ptsBot[j], ptsTop[j], ptsTop[i]];
    const ns = norm3(cross3(sub3(q[1], q[0]), sub3(q[2], q[0])));
    if (dot3(ns, V) > 0) faces.push({ pts: q, n: ns, top: false });
  }
  const stroke = lit ? "var(--anatomy-lit)" : tone === "hi" ? "var(--anatomy-hi)" : "var(--anatomy-mid)";
  let html = '<g class="iso-solid"' + (lit ? ' data-lit=""' : "") + ">";
  for (const f of faces) {
    const sh = f.top ? "top" : shadeFor(f.n);
    const fill = lit
      ? f.top ? "var(--anatomy-lit-top)" : "var(--anatomy-lit-shade)"
      : sh === "top" ? "var(--anatomy-top)" : "var(--anatomy-shade-" + sh + ")";
    html += '<path d="' + polyPath(f.pts) + '" fill="' + fill + '" stroke="' + (edge ? stroke : fill) + '" stroke-width="' + (edge ? "0.65" : "0.4") + '" stroke-linejoin="round"/>';
  }
  html += "</g>";
  return html;
}

// Disegna un'asta cilindrica 3D tra a e b con spessore reale e snodi sferici ai capi
function drawRod3D(a, b, r, { tone = "hi", lit = false, ends = true } = {}) {
  const pa = iso(a, P), pb = iso(b, P);
  const dx = pb[0] - pa[0], dy = pb[1] - pa[1];
  const len = Math.hypot(dx, dy) || 1;
  const nx = (-dy / len) * r * cam.k, ny = (dx / len) * r * cam.k;
  const body = "M" + f1(pa[0] + nx) + " " + f1(pa[1] + ny) + "L" + f1(pb[0] + nx) + " " + f1(pb[1] + ny) + "L" + f1(pb[0] - nx) + " " + f1(pb[1] - ny) + "L" + f1(pa[0] - nx) + " " + f1(pa[1] - ny) + "Z";
  const stroke = lit ? "var(--anatomy-lit)" : tone === "hi" ? "var(--anatomy-hi)" : "var(--anatomy-mid)";
  const fill = lit ? "var(--anatomy-lit-shade)" : "var(--anatomy-shade-2)";
  let out = '<path d="' + body + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="0.65" stroke-linejoin="round"/>';
  if (ends) {
    const er = Math.max(1.8, r * cam.k * 1.45);
    out += '<circle cx="' + f1(pa[0]) + '" cy="' + f1(pa[1]) + '" r="' + f1(er) + '" fill="' + (lit ? "var(--anatomy-lit-top)" : "var(--anatomy-top)") + '" stroke="' + stroke + '" stroke-width="0.65"/>';
    out += '<circle cx="' + f1(pb[0]) + '" cy="' + f1(pb[1]) + '" r="' + f1(er) + '" fill="' + (lit ? "var(--anatomy-lit-top)" : "var(--anatomy-top)") + '" stroke="' + stroke + '" stroke-width="0.65"/>';
  }
  return out;
}

// Anello inclinato 3D (piatto fisso o piatto rotante): composto da N spicchi ordinati in profondità così l'albero centrale passa DENTRO senza errori d'ordine!
function pushSwashRing(list, m, zOff, rIn, rOut, thick, segs, { tone = "mid", lit = false, lugAngles = [], lugOut = 0 } = {}) {
  const nrm = norm3([-m.gx, -m.gy, 1]);
  const ptAt = (r, a, h) => {
    const x = r * Math.cos(a), y = r * Math.sin(a);
    const z = m.zSw + zOff + m.gx * x + m.gy * y;
    return [x + nrm[0] * h, y + nrm[1] * h, z + nrm[2] * h];
  };
  for (let i = 0; i < segs; i++) {
    const a0 = (i / segs) * Math.PI * 2;
    const a1 = ((i + 1) / segs) * Math.PI * 2;
    const am = (a0 + a1) / 2;
    const top = [ptAt(rIn, a0, thick / 2), ptAt(rOut, a0, thick / 2), ptAt(rOut, a1, thick / 2), ptAt(rIn, a1, thick / 2)];
    const bot = [ptAt(rIn, a0, -thick / 2), ptAt(rOut, a0, -thick / 2), ptAt(rOut, a1, -thick / 2), ptAt(rIn, a1, -thick / 2)];
    const mid = ptAt((rIn + rOut) / 2, am, 0);
    list.push({ d: depthOf(mid, P), svg: drawBox3D(top, bot, { tone, lit, edge: false }) });
  }
  // Bordo superiore esterno & interno pulito dell'anello (evita righe radiali interne rumorose!)
  const ringPts = (r, h) => Array.from({ length: 48 }, (_, i) => iso(ptAt(r, (i / 48) * Math.PI * 2, h), P));
  const outTop = ringPts(rOut, thick / 2), inTop = ringPts(rIn, thick / 2), outBot = ringPts(rOut, -thick / 2);
  const loop = (pts) => "M" + pts.map((q) => f1(q[0]) + " " + f1(q[1])).join("L") + "Z";
  const st = lit ? "var(--anatomy-lit)" : tone === "hi" ? "var(--anatomy-hi)" : "var(--anatomy-mid)";
  list.push({
    d: depthOf([0, 0, m.zSw + zOff], P) + 0.5,
    svg:
      '<path d="' + loop(outTop) + '" fill="none" stroke="' + st + '" stroke-width="0.95"/>' +
      '<path d="' + loop(inTop) + '" fill="none" stroke="' + st + '" stroke-width="0.65"/>' +
      '<path d="' + loop(outBot) + '" fill="none" stroke="' + st + '" stroke-width="0.55" opacity="0.55"/>',
  });
  // Orecchie/attacchi radiali (3 per i servi sul fisso, 5 per le aste sul rotante)
  for (const a of lugAngles) {
    const da = 0.085;
    const top = [ptAt(rOut - 2, a - da, thick * 0.45), ptAt(lugOut, a - da * 0.7, thick * 0.45), ptAt(lugOut, a + da * 0.7, thick * 0.45), ptAt(rOut - 2, a + da, thick * 0.45)];
    const bot = [ptAt(rOut - 2, a - da, -thick * 0.45), ptAt(lugOut, a - da * 0.7, -thick * 0.45), ptAt(lugOut, a + da * 0.7, -thick * 0.45), ptAt(rOut - 2, a + da, -thick * 0.45)];
    list.push({ d: depthOf(ptAt((rOut + lugOut) / 2, a, 0), P) + 0.2, svg: drawBox3D(top, bot, { tone, lit }) });
  }
}

// Punto su una pala k ad azimut antiorario phi: u = (cos phi, -sin phi), bordo d'uscita t_trail = (sin phi, cos phi)
function bladePt(phi, pitchRad, flapRad, r, c, t) {
  const cp = Math.cos(pitchRad), sp = Math.sin(pitchRad);
  const c1 = c * cp + t * sp;
  const z1 = -c * sp + t * cp;
  const r2 = r * Math.cos(flapRad);
  const z2 = D.Z_HUB + r * Math.sin(flapRad) + z1;
  const ux = Math.cos(phi), uy = -Math.sin(phi);
  const tx = Math.sin(phi), ty = Math.cos(phi);
  return [r2 * ux + c1 * tx, r2 * uy + c1 * ty, z2];
}

function render(m) {
  const list = [];

  // 1. Steli dei 3 servoattuatori dal tetto servo (z=64) all'orecchia del piatto fisso
  D.SRV_ANGLES.forEach((deg) => {
    const a = deg * DEG;
    const x = D.R_SRV * Math.cos(a), y = D.R_SRV * Math.sin(a);
    const zTop = m.zSw - 4.5 + m.gx * x + m.gy * y;
    const p0 = [x, y, D.Z_SRV_TOP], p1 = [x, y, zTop];
    list.push({ d: depthOf([x, y, (D.Z_SRV_TOP + zTop) / 2], P), svg: drawRod3D(p0, p1, 2.3, { tone: "hi", ends: true }) });
  });

  // 2. Indice scorrevole sulla colonna di riscontro del collettivo (sinistra anteriore)
  {
    const idxZ = m.zSw;
    const pA = iso([-35, 105, idxZ], P);
    const pB = iso([-42, 105, idxZ], P);
    list.push({
      d: depthOf([-38, 105, idxZ], P) + 8,
      svg: '<path d="M' + f1(pA[0]) + " " + f1(pA[1]) + "L" + f1(pB[0]) + " " + f1(pB[1]) + '" stroke="var(--anatomy-lit)" stroke-width="2.2" stroke-linecap="round"/>',
    });
  }

  // 3. Tratto centrale dell'albero rotore (tra z=72 e il mozzo z=145), diviso sotto e sopra il piatto per ordine esatto
  {
    const mLow = cylinder(0, 0, 9.5, 72, Math.max(4, m.zSw - 72), P, 28);
    list.push({ d: depthOf([0, 0, (72 + m.zSw) / 2], P), svg: solidSvg(mLow, { tone: "hi", crease: "none" }) });
    const mHi = cylinder(0, 0, 9.5, m.zSw + 7, Math.max(4, D.Z_HUB - 6 - (m.zSw + 7)), P, 28);
    list.push({ d: depthOf([0, 0, (m.zSw + 7 + D.Z_HUB - 6) / 2], P), svg: solidSvg(mHi, { tone: "hi", crease: "none" }) });
  }

  // 4. Compasso fisso (MGB a 210° -> piatto fisso)
  {
    const a = 210 * DEG;
    const pBase = [38 * Math.cos(a), 38 * Math.sin(a), D.Z_DECK + 6];
    const pTop = [R_SW_F * Math.cos(a), R_SW_F * Math.sin(a), m.zSw - 4 + m.gx * R_SW_F * Math.cos(a) + m.gy * R_SW_F * Math.sin(a)];
    const kneeR = 54 + (110 - m.zSw) * 0.35;
    const pKnee = [kneeR * Math.cos(a), kneeR * Math.sin(a), (pBase[2] + pTop[2]) / 2];
    list.push({ d: depthOf(pKnee, P), svg: drawRod3D(pBase, pKnee, 1.5, { tone: "mid" }) + drawRod3D(pKnee, pTop, 1.5, { tone: "mid" }) });
  }

  // 5. Piatto oscillante FISSO (sotto, tone mid, 3 attacchi servi a 30°, 150°, 270°)
  pushSwashRing(list, m, -4.5, R_SW_IN, R_SW_F, 6.2, 18, { tone: "mid", lit: false, lugAngles: D.SRV_ANGLES.map((d) => d * DEG), lugOut: D.R_SRV + 3 });

  // 6. Piatto oscillante ROTANTE (sopra, LIT — il soggetto illuminato! 5 attacchi aste di passo all'azimut antiorario -(phi+LUG) in xy)
  const rotLugs = m.blades.map((b) => -(b.phi + LUG));
  pushSwashRing(list, m, +4.0, R_SW_IN, R_SW_R, 5.6, 18, { tone: "hi", lit: true, lugAngles: rotLugs, lugOut: R_HORN + 3 });

  // 7. Compasso rotante (albero rotore -> piatto rotante, gira col rotore in senso antiorario)
  {
    const a = -(m.ang + 36 * DEG);
    const pMast = [10 * Math.cos(a), 10 * Math.sin(a), D.Z_HUB - 14];
    const pSw = [R_SW_R * Math.cos(a), R_SW_R * Math.sin(a), m.zSw + 5 + m.gx * R_SW_R * Math.cos(a) + m.gy * R_SW_R * Math.sin(a)];
    const kneeR = 36 + (110 - m.zSw) * 0.25;
    const pKnee = [kneeR * Math.cos(a), kneeR * Math.sin(a), (pMast[2] + pSw[2]) / 2];
    list.push({ d: depthOf(pKnee, P) + 0.5, svg: drawRod3D(pMast, pKnee, 1.4, { tone: "hi" }) + drawRod3D(pKnee, pSw, 1.4, { tone: "hi" }) });
  }

  // 8. Cinque aste di comando del passo (lit!) dal piatto rotante alla squadretta sul bordo d'attacco di ciascuna pala
  m.blades.forEach((b) => {
    const aL = b.phi + LUG;
    const lx = R_HORN * Math.cos(aL), ly = -R_HORN * Math.sin(aL);
    const pBot = [lx, ly, m.zSw + 5 + m.gx * lx + m.gy * ly];
    const pHorn = bladePt(b.phi, b.pitch * DEG, b.flap * DEG, 42, -16, -2);
    const mid = [(pBot[0] + pHorn[0]) / 2, (pBot[1] + pHorn[1]) / 2, (pBot[2] + pHorn[2]) / 2];
    list.push({ d: depthOf(mid, P) + 0.4, svg: drawRod3D(pBot, pHorn, 1.55, { tone: "hi", lit: true, ends: true }) });
  });

  // 9. Mozzo a stella (5 bracci) + 5 smorzatori interpala + 5 manicotti a scatola + 5 pale con profilo ritorto dal passo reale!
  const hubCyl = cylinder(0, 0, R_HUB, D.Z_HUB - 6, 12, P, 40, 0.7);
  list.push({ d: depthOf([0, 0, D.Z_HUB], P), svg: solidSvg(hubCyl, { tone: "hi", crease: "lo" }) });

  m.blades.forEach((b, idx) => {
    const pr = b.pitch * DEG, fr = b.flap * DEG;
    // Squadretta di passo dal manicotto al bordo d'attacco (attacco asta)
    const pHornRoot = bladePt(b.phi, pr, fr, 42, -6, -1);
    const pHornTip = bladePt(b.phi, pr, fr, 42, -16, -2);
    list.push({ d: depthOf(pHornTip, P), svg: drawRod3D(pHornRoot, pHornTip, 1.6, { tone: "hi", ends: false }) });

    // Manicotto a scatola (caratteristico delle foto AW169!) + cuscinetto elastomerico alla radice
    const gTop = [
      bladePt(b.phi, pr, fr, R_GRIP0, -8.5, +4.8),
      bladePt(b.phi, pr, fr, R_GRIP1, -8.5, +4.8),
      bladePt(b.phi, pr, fr, R_GRIP1, +8.5, +4.8),
      bladePt(b.phi, pr, fr, R_GRIP0, +8.5, +4.8),
    ];
    const gBot = [
      bladePt(b.phi, pr, fr, R_GRIP0, -8.5, -4.8),
      bladePt(b.phi, pr, fr, R_GRIP1, -8.5, -4.8),
      bladePt(b.phi, pr, fr, R_GRIP1, +8.5, -4.8),
      bladePt(b.phi, pr, fr, R_GRIP0, +8.5, -4.8),
    ];
    list.push({ d: depthOf(bladePt(b.phi, pr, fr, (R_GRIP0 + R_GRIP1) / 2, 0, 0), P), svg: drawBox3D(gTop, gBot, { tone: "hi" }) });

    // Pala troncata da banco con corda e profilo visibilmente ruotati del vero angolo di passo theta_k!
    const bTop = [
      bladePt(b.phi, pr, fr, R_GRIP1, -11, +2.6),
      bladePt(b.phi, pr, fr, R_BLADE, -10, +2.2),
      bladePt(b.phi, pr, fr, R_BLADE, +13, +0.9),
      bladePt(b.phi, pr, fr, R_GRIP1, +12, +1.2),
    ];
    const bBot = [
      bladePt(b.phi, pr, fr, R_GRIP1, -11, -2.6),
      bladePt(b.phi, pr, fr, R_BLADE, -10, -2.2),
      bladePt(b.phi, pr, fr, R_BLADE, +13, -0.9),
      bladePt(b.phi, pr, fr, R_GRIP1, +12, -1.2),
    ];
    // Fascia antierosione sul bordo d'attacco (visibile sulle pale AW169)
    const leA = iso(bladePt(b.phi, pr, fr, R_GRIP1 + 2, -11, +2.6), P);
    const leB = iso(bladePt(b.phi, pr, fr, R_BLADE - 2, -10, +2.2), P);
    const leLine = '<path d="M' + f1(leA[0]) + " " + f1(leA[1]) + "L" + f1(leB[0]) + " " + f1(leB[1]) + '" stroke="var(--anatomy-blue)" stroke-width="1.35" opacity="0.78"/>';
    // Marcatura numerica 1..5 solo sulla punta tramite piccolo pallino/tacca (Pala 1 evidenziata!)
    list.push({
      d: depthOf(bladePt(b.phi, pr, fr, (R_GRIP1 + R_BLADE) / 2, 0, 0), P),
      svg: drawBox3D(bTop, bBot, { tone: idx === 0 ? "hi" : "mid", lit: false }) + leLine,
    });

    // Smorzatore interpala tra manicotto k e manicotto (k+1)
    const nextB = m.blades[(idx + 1) % NB];
    const dA = bladePt(b.phi, pr, fr, 46, -9.5, 0);
    const dB = bladePt(nextB.phi, nextB.pitch * DEG, nextB.flap * DEG, 46, +9.5, 0);
    const dM = [(dA[0] + dB[0]) / 2, (dA[1] + dB[1]) / 2, (dA[2] + dB[2]) / 2];
    list.push({ d: depthOf(dM, P), svg: drawRod3D(dA, dB, 2.2, { tone: "mid", ends: true }) });
  });

  // 10. Cappello a calotta bassa del mozzo AW169
  const cap = cylinder(0, 0, 26, D.Z_HUB + 6, 6.5, P, 48, 0.9);
  const capTop = cylinder(0, 0, 17, D.Z_HUB + 12.5, 3.2, P, 40, 0.5);
  list.push({ d: depthOf([0, 0, D.Z_HUB + 11], P) + 6, svg: solidSvg(cap, { tone: "hi", crease: "lo" }) + solidSvg(capTop, { tone: "hi" }) });

  // 11. Vettore di spinta risultante (lit!) con ghiera di riferimento orizzontale sopra la calotta
  {
    const base = [0, 0, D.Z_HUB + 15.7];
    const len = 34 + 0.26 * m.coll;
    const sx = m.lon * 0.5;
    const sy = m.lat * 0.5; // +x = PRUA, +y = DESTRA nel sistema iso-kit!
    const sz = Math.sqrt(Math.max(0.2, 1 - sx * sx - sy * sy));
    const tip = [base[0] + sx * len, base[1] + sy * len, base[2] + sz * len];
    const refTop = [0, 0, base[2] + 54];
    const pBase = iso(base, P), pTip = iso(tip, P), pRef = iso(refTop, P);
    const vx = pTip[0] - pBase[0], vy = pTip[1] - pBase[1];
    const vl = Math.hypot(vx, vy) || 1;
    const ux = vx / vl, uy = vy / vl;
    const px = -uy, py = ux;
    const ah1 = [pTip[0] - ux * 9.5 + px * 4.4, pTip[1] - uy * 9.5 + py * 4.4];
    const ah2 = [pTip[0] - ux * 9.5 - px * 4.4, pTip[1] - uy * 9.5 - py * 4.4];
    const refRing = ring(0, 0, 18, base[2] + 44, P, 36);
    const vecSvg =
      '<path d="' + refRing + '" fill="none" stroke="var(--anatomy-faint)" stroke-width="0.7"/>' +
      '<path d="M' + f1(pBase[0]) + " " + f1(pBase[1]) + "L" + f1(pRef[0]) + " " + f1(pRef[1]) + '" stroke="var(--anatomy-lo)" stroke-width="0.85" stroke-dasharray="2.5 3.5"/>' +
      '<path d="M' + f1(pBase[0]) + " " + f1(pBase[1]) + "L" + f1(pTip[0]) + " " + f1(pTip[1]) + '" stroke="var(--anatomy-lit)" stroke-width="2.3" stroke-linecap="round"/>' +
      '<path d="M' + f1(pTip[0]) + " " + f1(pTip[1]) + "L" + f1(ah1[0]) + " " + f1(ah1[1]) + "L" + f1(ah2[0]) + " " + f1(ah2[1]) + 'Z" fill="var(--anatomy-lit)"/>';
    list.push({ d: 1e6, svg: vecSvg });
  }

  list.sort((a, b) => a.d - b.d);
  liveG.innerHTML = list.map((o) => o.svg).join("");

  // Aggiorna letture e celle delle 5 pale
  vColl.textContent = Math.round(m.coll) + "% (" + m.th0.toFixed(1) + "°)";
  vLon.textContent = (m.lon > 0.02 ? "+" : "") + Math.round(m.lon * 100) + "%";
  vLat.textContent = (m.lat > 0.02 ? "+" : "") + Math.round(m.lat * 100) + "%";

  const maxP = Math.max(...m.blades.map((b) => b.pitch));
  const minP = Math.min(...m.blades.map((b) => b.pitch));
  m.blades.forEach((b, i) => {
    bCells[i].az.textContent = "Pala " + (i + 1) + " · " + b.deg + "°";
    bCells[i].val.textContent = b.pitch.toFixed(1) + "°";
    bCells[i].box.classList.toggle("max", maxP - minP > 0.4 && Math.abs(b.pitch - maxP) < 0.05);
  });
  thrVal.textContent = m.tilt < 0.25 ? "0.0° · verticale" : m.tilt.toFixed(1) + "° " + m.dirLabel;
  thrDir.textContent = "SPINTA (" + (m.coll < 35 ? "bassa" : m.coll < 70 ? "media" : "alta") + ")";

  const txt =
    "COLL " + m.th0.toFixed(1) + "° · P1 " + m.blades[0].pitch.toFixed(1) + "° · P2 " + m.blades[1].pitch.toFixed(1) + "° · P3 " + m.blades[2].pitch.toFixed(1) + "° · P4 " + m.blades[3].pitch.toFixed(1) + "° · P5 " + m.blades[4].pitch.toFixed(1) + "° · SPINTA " + (m.tilt < 0.25 ? "verticale" : m.tilt.toFixed(1) + "° " + m.dirLabel);
  if (readout.textContent !== txt) readout.textContent = txt;
}

let tColl = 50, coll = 50;
let tLon = 0, lon = 0;
let tLat = 0, lat = 0;
let ang = 18 * DEG;
let spinning = !still.matches, touring = !still.matches;
let clock = 0, visible = true, frame = 0, last = 0, idleTimer = 0;

function tourState(t) {
  const c = t % 16;
  if (c < 4) return { coll: 25, lon: 0, lat: 0 };       // collettivo basso, piatto piano
  if (c < 8) return { coll: 80, lon: 0, lat: 0 };       // collettivo alto, piatto sale uguale
  if (c < 12) return { coll: 55, lon: 0.85, lat: 0 };   // ciclico avanti, piatto inclinato
  return { coll: 55, lon: 0, lat: 0.85 };               // ciclico destra, passo varia con azimut
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (touring && !calm) {
    clock += dt;
    const s = tourState(clock);
    tColl = s.coll; tLon = s.lon; tLat = s.lat;
    slColl.value = String(Math.round(tColl));
    slLon.value = String(Math.round(tLon * 100));
    slLat.value = String(Math.round(tLat * 100));
  }
  const k = calm ? 1 : 1 - Math.exp(-dt / 0.2);
  coll += (tColl - coll) * k; if (Math.abs(tColl - coll) < 0.05) coll = tColl;
  lon += (tLon - lon) * k; if (Math.abs(tLon - lon) < 0.002) lon = tLon;
  lat += (tLat - lat) * k; if (Math.abs(tLat - lat) < 0.002) lat = tLat;
  if (spinning && !calm) ang = (ang + dt * Math.PI * 2 * 0.1) % (Math.PI * 2);

  render(rotorModel(coll, lon, lat, ang));

  const settled = !touring && !(spinning && !calm) && coll === tColl && lon === tLon && lat === tLat;
  frame = visible && !document.hidden && !settled ? requestAnimationFrame(tick) : 0;
}

const run = () => { if (!frame && visible && !document.hidden) { last = 0; frame = requestAnimationFrame(tick); } };

function userTakeOver() {
  touring = false;
  btnTour.textContent = "Ciclo auto: OFF";
  clearTimeout(idleTimer);
  if (!still.matches) {
    idleTimer = setTimeout(() => { touring = true; btnTour.textContent = "Ciclo auto: ON"; run(); }, 9000);
  }
  run();
}

slColl.addEventListener("input", (e) => { tColl = Number(e.target.value); userTakeOver(); });
slLon.addEventListener("input", (e) => { tLon = Number(e.target.value) / 100; userTakeOver(); });
slLat.addEventListener("input", (e) => { tLat = Number(e.target.value) / 100; userTakeOver(); });
btnSpin.addEventListener("click", () => {
  if (still.matches) return;
  spinning = !spinning;
  btnSpin.textContent = spinning ? "Rotazione: ON" : "Rotazione: PAUSA";
  btnSpin.classList.toggle("on", spinning);
  run();
});
btnZero.addEventListener("click", () => {
  tLon = 0; tLat = 0; slLon.value = "0"; slLat.value = "0";
  userTakeOver();
});
btnTour.addEventListener("click", () => {
  if (still.matches) return;
  touring = !touring;
  clearTimeout(idleTimer);
  btnTour.textContent = touring ? "Ciclo auto: ON" : "Ciclo auto: OFF";
  if (touring) run();
});

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (window.parent && window.parent !== window) window.parent.postMessage("uh169-fig-close", "*");
    return;
  }
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  if (e.key === "ArrowUp") { e.preventDefault(); tColl = clamp(tColl + 10, 0, 100); slColl.value = String(tColl); userTakeOver(); }
  else if (e.key === "ArrowDown") { e.preventDefault(); tColl = clamp(tColl - 10, 0, 100); slColl.value = String(tColl); userTakeOver(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); tLon = clamp(tLon + 0.25, -1, 1); slLon.value = String(Math.round(tLon * 100)); userTakeOver(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); tLon = clamp(tLon - 0.25, -1, 1); slLon.value = String(Math.round(tLon * 100)); userTakeOver(); }
  else if (e.key === " ") { e.preventDefault(); btnSpin.click(); }
});

document.addEventListener("visibilitychange", () => { if (!document.hidden && visible) run(); });
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
if (still.matches) { btnTour.textContent = "Moto ridotto"; btnSpin.textContent = "Rotazione: OFF"; }
render(rotorModel(coll, lon, lat, ang));
run();
</script></body></html>
