.iso-legend{font-size:13.5px;line-height:1.5;margin-top:10px;color:var(--anatomy-text)}

  <span class="iso-caption">Schema didattico illustrativo della MGB (Main Gear Box, trasmissione principale; non il disegno Leonardo): riceve i due alberi dai motori PW210A (classe 1000 shp, shaft horsepower, cavalli all’albero), ciascuno attraverso una ruota libera a senso unico e una coppia conica d’ingresso (2,0:1); i due pignoni cilindrici ingranano l’unico ingranaggio collettore (3,5:1) che somma la potenza dei due motori e aziona anche l’uscita di coda (1586 giri/min a NR, giri del rotore, al 100%: rapporto AAIB, Air Accidents Investigation Branch, 1/2023); sopra, lo stadio epicicloidale a corona fissa (3,6:1) riduce fino all’albero rotore (rapporto totale 25,2:1). La MGB dell’AW169 è certificata per 33 minuti di funzionamento a secco (certificato EASA, European Union Aviation Safety Agency, R.509). Attivando «Un motore fermo» (OEI, One Engine Inoperative, un motore inattivo), la ruota libera del motore 2 si svincola così il rotore non lo trascina, mentre il motore 1 porta l’intero carico. Denti, giri/min degli stadi (basati su ~330 giri/min tipici del rotore) e potenze in shp sono indicativi.</span>

    const sh = shadeFor(nrm);
    const fill = lit ? (sh === "top" ? "var(--anatomy-lit-top)" : "var(--anatomy-lit-shade)") : sh === "top" ? "var(--anatomy-top)" : "var(--anatomy-shade-" + sh + ")";
    const pts = [ring0[i], ring0[j], ring1[j], ring1[i]].map((q) => iso(q, P));
    quads.push({
      d: depthOf([(x0 + x1) / 2, r * Math.cos(am), D.Z_BEV + r * Math.sin(am)], P),
      svg: '<path d="M' + pts.map((q) => f1(q[0]) + " " + f1(q[1])).join("L") + 'Z" fill="' + fill + '" stroke="' + fill + '" stroke-width="0.45"/>',
    });
  }
  quads.sort((a, b) => a.d - b.d);
  let out = quads.map((q) => q.svg).join("");
  // Solo i due bordi esterni (silhouette) e l'arco visibile dell'estremità lontana
  const farArc = [];
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    if (dot3([0, Math.cos(a), Math.sin(a)], V) >= -0.05) farArc.push(iso(farRing[i], P));
  }
  if (visIdx.length) {
    const iA = visIdx[0], iB = (visIdx[visIdx.length - 1] + 1) % N;
    const eA0 = iso(ring0[iA], P), eA1 = iso(ring1[iA], P);
    const eB0 = iso(ring0[iB], P), eB1 = iso(ring1[iB], P);
    out += '<path d="M' + f1(eA0[0]) + " " + f1(eA0[1]) + "L" + f1(eA1[0]) + " " + f1(eA1[1]) + "M" + f1(eB0[0]) + " " + f1(eB0[1]) + "L" + f1(eB1[0]) + " " + f1(eB1[1]) + '" stroke="' + stroke + '" stroke-width="0.7"/>';
  }
  // Tacche assiali rotanti sul fianco visibile
  let mk = "";
  for (let k = 0; k < notches; k++) {
    const a = theta + (k / notches) * Math.PI * 2;
    if (dot3([0, Math.cos(a), Math.sin(a)], V) < 0.16) continue;
    const pa = iso([x0 + 1, r * Math.cos(a), D.Z_BEV + r * Math.sin(a)], P);
    const pb = iso([x1 - 1, r * Math.cos(a), D.Z_BEV + r * Math.sin(a)], P);
    mk += "M" + f1(pa[0]) + " " + f1(pa[1]) + "L" + f1(pb[0]) + " " + f1(pb[1]);
  }
  if (mk) out += '<path d="' + mk + '" stroke="' + stroke + '" stroke-width="1.3" stroke-linecap="round"/>';
  // Tappo vicino opaco con razza di fase
  const capPts = nearRing.map((q) => iso(q, P));
  out += '<path d="M' + capPts.map((q) => f1(q[0]) + " " + f1(q[1])).join("L") + 'Z" fill="' + (lit ? "var(--anatomy-lit-top)" : "var(--anatomy-shade-3)") + '" stroke="' + stroke + '" stroke-width="0.75"/>';
  return out;
}

// Pignone conico SOLIDO su asse x (facce ordinate back-to-front -> zero trasparenza!)
function bevelX(xBase, xTip, rBase, rTip, theta, { tone = "hi", accent = null } = {}) {
  const N = 18;
  const ring0 = [], ring1 = [];
  for (let i = 0; i < N; i++) {
    const a = theta + (i / N) * Math.PI * 2;
    const tooth = i % 2 === 0 ? 1.09 : 0.91;
    ring0.push([xBase, rBase * tooth * Math.cos(a), D.Z_BEV + rBase * tooth * Math.sin(a)]);
    ring1.push([xTip, rTip * tooth * Math.cos(a), D.Z_BEV + rTip * tooth * Math.sin(a)]);
  }
  const stroke = accent || (tone === "hi" ? "var(--anatomy-hi)" : "var(--anatomy-mid)");
  const faces = [];
  for (let i = 0; i < N; i++) {
    const j = (i + 1) % N;
    const q = [ring0[i], ring0[j], ring1[j], ring1[i]];
    const nrm = norm3(cross3(sub3(q[1], q[0]), sub3(q[2], q[0])));
    // Forza orientazione normale uscente
    const mid = [(q[0][0] + q[2][0]) / 2, (q[0][1] + q[2][1]) / 2, (q[0][2] + q[2][2]) / 2];
    const radial = [0, mid[1], mid[2] - D.Z_BEV];
    const outN = dot3(nrm, radial) >= 0 ? nrm : nrm.map((v) => -v);
    if (dot3(outN, V) <= 0) continue;
    const sh = shadeFor(outN);
    const fill = sh === "top" ? "var(--anatomy-top)" : "var(--anatomy-shade-" + sh + ")";
    const pts = q.map((p) => iso(p, P));
    faces.push({
      d: depthOf(mid, P),
      svg: '<path d="M' + pts.map((p) => f1(p[0]) + " " + f1(p[1])).join("L") + 'Z" fill="' + fill + '" stroke="' + stroke + '" stroke-width="0.55" stroke-linejoin="round"/>',
    });
  }
  faces.sort((a, b) => a.d - b.d);
  // Tappo visibile lato esterno
  const capRing = (xBase - xTip) * V[0] > 0 ? ring0 : ring1;
  const capPts = capRing.map((p) => iso(p, P));
  return faces.map((f) => f.svg).join("") + '<path d="M' + capPts.map((p) => f1(p[0]) + " " + f1(p[1])).join("L") + 'Z" fill="var(--anatomy-shade-2)" stroke="' + stroke + '" stroke-width="0.65"/>';
}

function modelAt(loadShp, oeiOn, m2Ratio) {
  const nr = 100;
  const rpmRotor = RPM_ROT;
  const rpmSun = rpmRotor * R3;
  const rpmPin = rpmSun * R2;
  const rpmIn = rpmPin * R1;
  const rpmM2 = rpmIn * m2Ratio;
  const disengaged = m2Ratio < 0.97;
  const p1 = oeiOn ? loadShp : loadShp / 2;
  const p2 = oeiOn ? 0 : loadShp / 2;
  return { nr, rpmRotor, rpmSun, rpmPin, rpmIn, rpmM2, disengaged, p1, p2, loadShp, oeiOn };
}

let oei = false;
let loadShp = 760; // shp totali tipici al rotore (due PW210A classe 1000 shp ciascuno)
let m2Spd = 1.0;   // velocità normalizzata motore 2 (1.0 agganciato -> 0.0 fermo in OEI)
let A_rot = 0.25;  // angolo portasatelliti / albero rotore (rad)
let angM2 = 0.25 * RTOT;
let paused = still.matches;
let visible = true, frame = 0, last = 0;

function render(m) {
  const list = [];
  const ts = A_rot * R3; // angolo collettore e solare (esatta equazione Trasmissione progetto.md)

  // 1. Ingranaggio collettore (42 denti, somma i due motori!) + albero solare centrale
  list.push({
    d: depthOf([0, 0, D.Z_COL], P),
    svg: gearZ(0, 0, D.Z_COL - 5, D.Z_COL + 5, 44.5, NC, ts, { tone: "hi", holeR: 9 }),
  });
  // Uscita posteriore verso il rotore di coda (1586 giri/min a NR 100%, sotto/dietro il collettore)
  {
    const tailShaft = slabOf({ x: -3.2, y: -76, w: 6.4, d: 34, r: 2.5 }, D.Z_COL - 13, 6.4, P, 3);
    list.push({ d: depthOf([0, -58, D.Z_COL - 10], P), svg: solidSvg(tailShaft, { tone: "mid" }) });
  }
  // Albero centrale dal collettore al solare (z = Z_COL+5 .. Z_PLAN-6)
  list.push({
    d: depthOf([0, 0, (D.Z_COL + D.Z_PLAN) / 2], P),
    svg: solidSvg(cylinder(0, 0, 7.5, D.Z_COL + 5, D.Z_PLAN - 6 - (D.Z_COL + 5), P, 28), { tone: "hi", crease: "none" }),
  });

  // 2. Due lati d'ingresso: s=0 Motore 2 (+x destra), s=1 Motore 1 (-x sinistra)
  [
    { s: 0, sign: 1, off: m.disengaged, engAng: angM2, active: !m.oeiOn },
    { s: 1, sign: -1, off: false, engAng: A_rot * RTOT, active: true },
  ].forEach(({ s, sign, off, engAng, active }) => {
    const xPin = sign * D.X_PIN;
    const phi = s * Math.PI;
    // Esatta fase denti da Trasmissione progetto.md!
    const thPin = -(ts - phi) * R2 + phi + Math.PI + Math.PI / NPI;
    const thMgbIn = A_rot * RTOT;

    // Pignone cilindrico (12 denti) che ingrana il collettore
    list.push({
      d: depthOf([xPin, 0, D.Z_COL], P),
      svg: gearZ(xPin, 0, D.Z_COL - 5, D.Z_COL + 5, 13.5, NPI, thPin, { tone: active ? "hi" : "mid", holeR: 4.5 }),
    });
    // Albero verticale del pignone fino alla ruota conica (z = Z_COL+5 .. Z_BEV-8)
    list.push({
      d: depthOf([xPin, 0, (D.Z_COL + D.Z_BEV) / 2], P),
      svg: solidSvg(cylinder(xPin, 0, 4.6, D.Z_COL + 5, D.Z_BEV - 10 - (D.Z_COL + 5), P, 20), { tone: "mid", crease: "none" }),
    });
    // Ruota conica ad asse verticale (18 denti, stadio 1)
    list.push({
      d: depthOf([xPin, 0, D.Z_BEV - 7], P),
      svg: gearZ(xPin, 0, D.Z_BEV - 11, D.Z_BEV - 4, 18.5, 18, thPin, { tone: active ? "hi" : "mid", holeR: 5 }),
    });

    // Pignone conico orizzontale (9 denti) + albero fino alla metà MGB della ruota libera
    const xBev0 = sign * (D.X_PIN + 17), xBev1 = sign * (D.X_PIN + 26);
    list.push({
      d: depthOf([sign * (D.X_PIN + 21), 0, D.Z_BEV], P),
      svg: bevelX(xBev1, xBev0, 11.5, 8.2, sign * thMgbIn, { tone: active ? "hi" : "mid" }),
    });
    // Albero ingresso lato MGB
    list.push({
      d: depthOf([sign * 90, 0, D.Z_BEV], P),
      svg: drumX(Math.min(xBev1, sign * D.X_FW_IN), Math.max(xBev1, sign * D.X_FW_IN), 4.6, sign * thMgbIn, { tone: "mid", notches: 4 }),
    });

    // RUOTA LIBERA A DUE METÀ!
    // Metà lato MGB (gira sempre con il rotore!)
    const xMgb0 = sign * D.X_FW_IN, xMgb1 = sign * (D.X_FW_IN + 10);
    list.push({
      d: depthOf([sign * (D.X_FW_IN + 5), 0, D.Z_BEV], P),
      svg: drumX(Math.min(xMgb0, xMgb1), Math.max(xMgb0, xMgb1), 11.5, sign * thMgbIn, {
        tone: "hi",
        accent: off ? "var(--anatomy-blue)" : "var(--anatomy-hi)",
        notches: 6,
      }),
    });
    // Anello di svincolo (rulli/sprag tra le due metà: chiuso e bianco se agganciato, aperto e arancione se disinnestato!)
    const xGap = sign * (D.X_FW_IN + 11.5);
    const pGap = iso([xGap, 0, D.Z_BEV], P);
    list.push({
      d: depthOf([xGap, 0, D.Z_BEV], P) + 0.6,
      svg: off
        ? '<circle cx="' + f1(pGap[0]) + '" cy="' + f1(pGap[1]) + '" r="8.5" fill="none" stroke="var(--anatomy-red)" stroke-width="1.6" stroke-dasharray="3 3"/>'
        : '<circle cx="' + f1(pGap[0]) + '" cy="' + f1(pGap[1]) + '" r="7.5" fill="none" stroke="var(--anatomy-green)" stroke-width="1.2" opacity="0.85"/>',
    });
    // Metà lato MOTORE (gira con il motore: si FERMA sul Motore 2 in OEI!)
    const xEng0 = sign * (D.X_FW_IN + 13), xEng1 = sign * (D.X_FW_OUT + 3);
    list.push({
      d: depthOf([sign * (D.X_FW_IN + 18), 0, D.Z_BEV], P),
      svg: drumX(Math.min(xEng0, xEng1), Math.max(xEng0, xEng1), 11.5, sign * engAng, {
        tone: off ? "mid" : "hi",
        accent: off ? "var(--anatomy-red)" : "var(--anatomy-green)",
        notches: 6,
      }),
    });
    // Albero motore esterno fino al cuscinetto di ingresso
    list.push({
      d: depthOf([sign * 133, 0, D.Z_BEV], P),
      svg: drumX(Math.min(xEng1, sign * 139), Math.max(xEng1, sign * 139), 4.6, sign * engAng, { tone: off ? "mid" : "hi", notches: 4 }),
    });
    // Mozzo esterno oltre il cuscinetto (x = ±161..±174)
    list.push({
      d: depthOf([sign * 167, 0, D.Z_BEV], P),
      svg: drumX(Math.min(sign * 161, sign * 174), Math.max(sign * 161, sign * 174), 6.5, sign * engAng, {
        tone: off ? "mid" : "hi",
        accent: off ? "var(--anatomy-red)" : null,
        notches: 6,
      }),
    });
  });

  // 3. Stadio epicicloidale (z = Z_PLAN = 98): solare (15 denti) + 3 satelliti (12 denti) + portasatelliti e ALBERO ROTORE (lit!)
  list.push({
    d: depthOf([0, 0, D.Z_PLAN], P),
    svg: gearZ(0, 0, D.Z_PLAN - 6, D.Z_PLAN + 6, 16.2, NS, ts, { tone: "hi", holeR: 5 }),
  });
  const R_ORB = 29.4;
  const pinPts = [];
  for (let k = 0; k < 3; k++) {
    const ps = A_rot + (k * Math.PI * 2) / 3;
    const px = R_ORB * Math.cos(ps), py = R_ORB * Math.sin(ps);
    const thPl = ps * (1 - NR / NP) + Math.PI / NP; // fase esatta da Trasmissione progetto.md!
    pinPts.push([px, py]);
    list.push({
      d: depthOf([px, py, D.Z_PLAN], P),
      svg: gearZ(px, py, D.Z_PLAN - 5.5, D.Z_PLAN + 5.5, 13.0, NP, thPl, { tone: "hi", holeR: 3.5 }),
    });
    // Perno satellite verso il portasatelliti (z = Z_PLAN+5.5 .. Z_PLAN+15)
    list.push({
      d: depthOf([px, py, D.Z_PLAN + 10], P) + 0.3,
      svg: solidSvg(cylinder(px, py, 3.2, D.Z_PLAN + 5.5, 9.5, P, 16), { tone: "hi", lit: true, crease: "none" }),
    });
  }
  // Portasatelliti a disco (gira a velocità lenta NR!) + ALBERO ROTORE (LIT!)
  list.push({
    d: depthOf([0, 0, D.Z_PLAN + 18], P) + 4,
    svg:
      solidSvg(cylinder(0, 0, 34, D.Z_PLAN + 15, 6, P, 48, 0.7), { tone: "hi", lit: true, crease: "lo" }) +
      dotsSvg(pinPts.map(([px, py]) => iso([px, py, D.Z_PLAN + 21], P)), { size: 1.8, tone: "hi" }),
  });
  list.push({
    d: depthOf([0, 0, D.Z_PLAN + 42], P) + 5,
    svg: solidSvg(cylinder(0, 0, 10.5, D.Z_PLAN + 21, 38, P, 32, 0.5), { tone: "hi", lit: true, crease: "none" }),
  });
  // Flangia superiore albero rotore con tacca di fase rotante (mostra chiaramente la rotazione lenta 1× NR!)
  {
    const zTop = D.Z_PLAN + 59;
    const fl = solidSvg(cylinder(0, 0, 16, zTop, 5, P, 36, 0.6), { tone: "hi", lit: true });
    const p0 = iso([0, 0, zTop + 5], P);
    const p1 = iso([14 * Math.cos(A_rot), 14 * Math.sin(A_rot), zTop + 5], P);
    const ptr = '<path d="M' + f1(p0[0]) + " " + f1(p0[1]) + "L" + f1(p1[0]) + " " + f1(p1[1]) + '" stroke="var(--anatomy-blue)" stroke-width="2.2" stroke-linecap="round"/>';
    list.push({ d: depthOf([0, 0, zTop + 3], P) + 6, svg: fl + ptr });
  }

  // Cursore fisico dell'interruttore OEI sul banco anteriore destro
  {
    const xSw = D.SW_BOX.x + (m.oeiOn ? 32 : 14);
    const swKnob = solidSvg(slabOf({ x: xSw - 4, y: D.SW_BOX.y + 6, w: 8, d: 10, r: 1.2 }, 10, 8, P, 3, 0.5), { tone: "hi", lit: m.oeiOn });
    list.push({ d: depthOf([xSw, D.SW_BOX.y + 11, 14], P) + 12, svg: swKnob });
  }

  list.sort((a, b) => a.d - b.d);
  trainG.innerHTML = list.map((o) => o.svg).join("");

  // Aggiorna letture e pannello stadi
  loadVal.textContent = Math.round(m.loadShp) + " shp";
  p1Val.textContent = Math.round(m.p1) + " shp";
  p2Val.textContent = m.oeiOn ? "0 shp (svincolato)" : Math.round(m.p2) + " shp";
  p2Box.classList.toggle("off", m.oeiOn);
  ptVal.textContent = Math.round(m.loadShp) + " shp";

  stIn.textContent = Math.round(m.rpmIn) + " g/min";
  st1.textContent = Math.round(m.rpmPin) + " g/min";
  st2.textContent = Math.round(m.rpmSun) + " g/min";
  st3.textContent = Math.round(m.rpmRotor) + " g/min";
  stTail.textContent = "1586 g/min";

  const mode = m.oeiOn ? "1 MOTORE (OEI: ruota libera 2 disinnestata)" : "2 MOTORI (ruote libere 1 e 2 agganciate)";
  const txt = mode + " · M1 " + Math.round(m.p1) + " shp · M2 " + Math.round(m.p2) + " shp · RAPPORTO 25,2:1 · NR 100%";
  if (readout.textContent !== txt) readout.textContent = txt;
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  const wantM2 = oei ? 0.0 : 1.0;
  m2Spd = calm ? wantM2 : m2Spd + (wantM2 - m2Spd) * (1 - Math.exp(-dt / 0.45));
  if (Math.abs(wantM2 - m2Spd) < 0.004) m2Spd = wantM2;

  if (!paused && !calm) {
    const wRot = Math.PI * 2 * 0.065; // rotore lento e leggibile; alberi motore 25.2x più veloci!
    A_rot = (A_rot + wRot * dt) % (Math.PI * 2 * 10);
    angM2 = (angM2 + wRot * RTOT * m2Spd * dt) % (Math.PI * 2 * 100);
  }
  render(modelAt(loadShp, oei, m2Spd));

  const settled = (paused || calm) && m2Spd === wantM2;
  frame = visible && !document.hidden && !settled ? requestAnimationFrame(tick) : 0;
}

const run = () => { if (!frame && visible && !document.hidden) { last = 0; frame = requestAnimationFrame(tick); } };

function toggleOei() {
  oei = !oei;
  btnOei.classList.toggle("on", oei);
  btnOei.setAttribute("aria-pressed", String(oei));
  oeiLbl.textContent = oei ? "Un motore fermo: ATTIVO (Motore 2 svincolato)" : "Un motore fermo (OEI): OFF";
  render(modelAt(loadShp, oei, m2Spd)); // lettura subito, senza attendere il frame
  run();
}

btnOei.addEventListener("click", toggleOei);
slLoad.addEventListener("input", (e) => { loadShp = Number(e.target.value); run(); });
btnPause.addEventListener("click", () => {
  if (still.matches) return;
  paused = !paused;
  btnPause.textContent = paused ? "Riprendi moto" : "Pausa moto";
  run();
});

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    if (window.parent && window.parent !== window) window.parent.postMessage("uh169-fig-close", "*");
    return;
  }
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  if (e.key === "o" || e.key === "O" || e.key === "Enter") { e.preventDefault(); toggleOei(); }
  else if (e.key === " ") { e.preventDefault(); btnPause.click(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); loadShp = clamp(loadShp + 60, 300, 960); slLoad.value = String(loadShp); run(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); loadShp = clamp(loadShp - 60, 300, 960); slLoad.value = String(loadShp); run(); }
});

document.addEventListener("visibilitychange", () => { if (!document.hidden && visible) run(); });
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
if (still.matches) btnPause.textContent = "Moto ridotto";
render(modelAt(loadShp, oei, m2Spd));
run();
</script></body></html>
